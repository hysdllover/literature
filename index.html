<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="문학 노트">
<meta name="theme-color" content="#f5f5f3">
<title>문학 연계 노트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32-v2.png">
<link rel="shortcut icon" href="icons/favicon-32-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@400;500&display=swap">
<style id="css">
:root{--bg:#f5f5f3;--surface:#fff;--ink:#2e3540;--sub:#747b86;--line:#e2e3e0;--tint:#eef0f2;
--navy:#3f536b;--olive:#6f7a55;--violet:#857a9b;--rose:#a8808c;--slate:#5f7184;
--sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
--serif:"Noto Serif KR","AppleMyungjo",serif;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:300 12px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:16px 18px 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.brand{flex:1;min-width:0}
.brand h1{font:500 14.5px/1.3 var(--serif);color:var(--navy);letter-spacing:-.01em}
.brand p{font-size:10.5px;color:var(--sub)}
.tabs{display:flex;background:var(--tint);border-radius:9px;padding:3px}
.tabs button{padding:6px 14px;border-radius:7px;font-size:11px;color:var(--sub);min-height:32px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:400;box-shadow:0 1px 2px rgba(40,50,60,.08)}
.add{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);font-size:17px;line-height:1;color:var(--navy);background:var(--surface)}
.add.aa{font:400 11px/1 var(--serif)}
:root[data-palette="lavender"]{--bg:#f6f5f8;--tint:#eeecf3;--line:#e4e2e9;--navy:#5d5a7f;--olive:#7b8a6f;--violet:#9a8fb6;--rose:#b58fa1;--slate:#6f7691}
:root[data-palette="sage"]{--bg:#f4f5f2;--tint:#ebeee8;--line:#e0e3dd;--navy:#4e6358;--olive:#77845c;--violet:#8b8aa1;--rose:#a98b7f;--slate:#667a73}
:root[data-palette="rose"]{--bg:#f7f4f4;--tint:#f1eaeb;--line:#e8e0e1;--navy:#6b4f5c;--olive:#808566;--violet:#8f80a0;--rose:#b3858f;--slate:#7b6e79}
:root[data-palette="bluegray"]{--bg:#f3f5f7;--tint:#e9eef2;--line:#dfe4e9;--navy:#40607a;--olive:#6c8176;--violet:#7c86a7;--rose:#a08a9b;--slate:#607789}
.card,.list,.sheet dl{zoom:var(--z,1)}
.set-label{font-size:10.5px;color:var(--sub);margin:14px 0 6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--tint);border-radius:9px;padding:3px;gap:2px}
.seg button{min-height:38px;border-radius:7px;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:400;box-shadow:0 1px 2px rgba(40,50,60,.08)}
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.themes button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border:1px solid var(--line);border-radius:10px;font-size:10.5px;color:var(--sub)}
.themes button[aria-pressed="true"]{border-color:var(--navy);color:var(--ink)}
.sw{display:flex;gap:3px}
.sw i{width:10px;height:10px;border-radius:50%}
.preview{margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:11.5px;zoom:var(--z,1)}
.preview b{font:500 13px var(--serif);display:block;margin-bottom:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--sub);background:var(--surface);min-height:30px}
.chip[aria-pressed="true"]{border-color:var(--navy);color:var(--navy);background:var(--tint);font-weight:400}
.chips + .chips{margin-bottom:8px}
/* card */
.stage{margin-top:10px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px 18px 28px;box-shadow:inset 4px 0 0 var(--g)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--sub)}
.meta .genre{color:var(--g);font-weight:400}
.meta button{color:var(--navy);font-size:11px;padding:4px 2px;min-height:32px}
.card h2{font:500 clamp(19px,4.73vw,24px)/1.3 var(--serif);letter-spacing:-.02em;word-break:keep-all;margin-top:4px}
.author-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.card .author{color:var(--sub);font-size:11.5px}
.field{padding:9px 0;border-top:1px solid var(--line);scroll-margin-top:56px}
.field:first-of-type{border-top:0;padding-top:0}
.field dt{font-size:10px;color:var(--sub);margin-bottom:2px}
.field dd{font-size:11.5px;word-break:keep-all}
.field ul{list-style:none}
.field li{position:relative;padding-left:11px}
.field li::before{content:"";position:absolute;left:0;top:.72em;width:4px;height:1px;background:var(--sub)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:10.5px;padding:1px 8px;border-radius:5px;background:var(--tint);color:var(--ink)}
.quote{font-family:var(--serif);font-size:11.5px;line-height:1.8;color:var(--ink);white-space:pre-line}
.nav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}
.nav button{padding:8px 14px;min-height:40px;color:var(--navy);font-size:11.5px}
.nav button:disabled{color:var(--line)}
.nav span{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:60px 20px;color:var(--sub)}
.empty button{margin-top:12px;color:var(--navy);border:1px solid var(--line);border-radius:8px;padding:8px 14px;background:var(--surface)}
/* list */
.search{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13.5px;font-weight:300;-webkit-appearance:none;appearance:none}
.summary{display:flex;justify-content:space-between;align-items:center;margin:10px 2px;font-size:10.5px;color:var(--sub)}
.summary button{color:var(--navy);font-size:11px;padding:4px 2px}
.list{list-style:none;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.list li{min-width:0}
@media (min-width:700px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.row{position:relative;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px 11px 18px;overflow:hidden;min-height:64px}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--g)}
.row .t{display:flex;align-items:baseline;gap:8px}
.row strong{font:500 13px/1.4 var(--serif)}
.row .a{font-size:11px;color:var(--sub)}
.row .s{font-size:10.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(25,30,38,.38);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:16px 16px 0 0;
padding:18px 20px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-head h2{font:500 15.5px/1.3 var(--serif)}
.sheet-head button{color:var(--sub);font-size:11px;padding:6px}
.form label{display:block;font-size:10.5px;color:var(--sub);margin:10px 0 4px}
.form input,.form select,.form textarea{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13.5px;font-weight:300;-webkit-appearance:none;appearance:none}
.form textarea{min-height:64px;resize:vertical;line-height:1.5}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form small{font-size:9.5px;color:var(--sub)}
.actions{display:flex;gap:8px;margin-top:18px}
.actions button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);font-size:12px}
.actions .primary{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.actions .danger{color:var(--rose)}
.actions .danger.armed{background:var(--rose);border-color:var(--rose);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:11px;z-index:30}
.print{display:none}
.icon{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--navy);font-size:15.5px;line-height:1;flex:none}
.tabs.wide{display:grid;grid-template-columns:repeat(5,1fr);margin-bottom:10px}
.tabs.wide button{padding:6px 2px;font-size:11px}
.pre{white-space:pre-line}
button.tag{cursor:pointer;min-height:24px;line-height:1.5}
.links{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.link{color:var(--navy);text-align:left;padding:3px 0;font-size:11.5px;min-height:28px}
.link small{color:var(--sub);font-size:10px;margin-left:6px}
.nav{margin:2px 0 10px}
.mini{display:flex;align-items:center;gap:10px}
.seg2{display:flex;background:var(--tint);border-radius:7px;padding:2px}
.seg2 button{padding:3px 9px;border-radius:5px;font-size:10.5px;color:var(--sub);min-height:28px}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.textbtn{color:var(--navy);font-size:11px;padding:4px 2px;min-height:28px}
.row.compact{min-height:44px;padding:9px 14px 9px 18px}
.cloud{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 16px}
.chip .n{font-size:9.5px;color:var(--sub);margin-left:5px}
.sec{font:500 13px/1.4 var(--serif);margin:4px 2px 8px}
.sec span{font:300 10.5px var(--sans);color:var(--sub);margin-left:4px}
.hint{font-size:10px;color:var(--sub);line-height:1.6;margin:8px 0}
.sub-meta{font-size:11px;color:var(--sub);margin-bottom:12px}
.sub-meta .genre{color:var(--g)}
.menu-list{display:grid;gap:6px}
.menu-item{text-align:left;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.menu-item b{display:block;font-weight:400;font-size:12px}
.menu-item span{font-size:10.5px;color:var(--sub)}
.frow{display:grid;grid-template-columns:1fr 100px 30px 30px 44px;gap:5px;align-items:center;margin-bottom:6px}
.frow input,.frow select{width:100%;min-width:0;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13.5px;font-weight:300;-webkit-appearance:none;appearance:none}
.frow button{min-height:36px;border:1px solid var(--line);border-radius:8px;color:var(--sub);font-size:11px}
.frow button:disabled{opacity:.35}
.frow button.armed{background:var(--rose);border-color:var(--rose);color:var(--surface)}
.btn{flex:1;min-height:42px;border:1px solid var(--line);border-radius:10px;font-size:11.5px;background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.btn:disabled{opacity:.5}
.btn.full{width:100%;display:flex;align-items:center;justify-content:center;margin-top:6px}
.btnrow{display:flex;gap:8px;margin-top:12px}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.note{background:var(--tint);border-radius:10px;padding:10px 12px;font-size:11px;line-height:1.6;margin:4px 0 8px}
.err{color:var(--rose);font-size:11px;margin-top:8px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.check,.form label.check{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink);min-height:36px;margin:4px 0}
.check input{width:16px;height:16px;accent-color:var(--navy);flex:none}
.pick{max-height:190px;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:2px 10px}
.form .pick label{display:flex;align-items:center;gap:8px;margin:0;padding:7px 0;font-size:11.5px;color:var(--ink)}
.pick input{width:16px;height:16px;accent-color:var(--navy);flex:none}
.pick small{color:var(--sub);font-size:10px}
.form textarea.big{min-height:240px}
.form input[type="checkbox"]{-webkit-appearance:auto;appearance:auto;width:16px;height:16px;padding:0;border:0;background:none;flex:none}
.plist{list-style:none;border-top:1px solid var(--line);margin-bottom:6px}
.plist li{display:flex;gap:6px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:11px}
.plist b{font:500 12px var(--serif)}
.plist span{margin-left:auto;font-size:10px;color:var(--sub)}
.actions .primary.armed-p{background:var(--rose);border-color:var(--rose)}
.wrap.wide{max-width:1180px}
.meta-act{display:flex;align-items:center;gap:10px}
.star{font-size:14.5px!important;color:var(--rose)!important;min-width:32px}
.fav{color:var(--rose);font-size:10.5px;margin-right:2px}
.toc{position:sticky;top:0;z-index:2;display:flex;gap:4px;overflow-x:auto;background:var(--surface);margin:-4px -22px 6px -24px;padding:8px 22px 8px 24px;border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.toc::-webkit-scrollbar{display:none}
.toc button{flex:none;font-size:10px;padding:3px 10px;border-radius:999px;background:var(--tint);color:var(--sub);min-height:26px}
.bodytext{font:400 13px/2 var(--serif);white-space:pre-wrap;word-break:keep-all;padding:6px 0}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.split-body{border-right:1px solid var(--line);padding-right:24px;position:sticky;top:8px;align-self:start;max-height:calc(100vh - 16px);overflow-y:auto}
mark{background:color-mix(in srgb,var(--violet) 24%,transparent);color:inherit;padding:0 2px;border-radius:2px}
b{font-weight:500}
u{text-decoration-color:var(--rose);text-underline-offset:3px}
.clink{font:inherit;color:inherit;display:inline;padding:0;text-decoration:underline dotted;text-decoration-color:var(--navy);text-underline-offset:3px;cursor:pointer}
.advbar{display:flex;align-items:center;gap:8px;background:var(--tint);border-radius:9px;padding:6px 12px;font-size:10.5px;color:var(--ink);margin:4px 0 8px}
.advbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.textbtn.sub{color:var(--sub)}
.draftbar{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--olive) 14%,var(--surface));border-radius:10px;padding:7px 12px;font-size:11px;margin:0 0 10px}
.draftbar span{flex:1}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.imgs figure{margin:0}
.imgs button{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;aspect-ratio:4/3;background:var(--tint)}
.imgs img{width:100%;height:100%;object-fit:cover;display:block}
.imgs figcaption{font-size:10px;color:var(--sub);margin-top:3px}
.lightbox{width:100%;height:auto;border-radius:8px;display:block}
.fimgs{display:grid;gap:6px}
.fimg{display:grid;grid-template-columns:64px 1fr 48px;gap:8px;align-items:center}
.fimg img{width:64px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.fimg button{min-height:36px;border:1px solid var(--line);border-radius:8px;font-size:11px;color:var(--rose)}
.form .fimg input{margin:0}
.fmtbar{position:sticky;top:-18px;z-index:3;display:flex;align-items:center;gap:6px;background:var(--surface);padding:8px 0;margin:0 0 4px;border-bottom:1px solid var(--line)}
.fmtbar button{min-height:32px;padding:0 10px;border:1px solid var(--line);border-radius:7px;font-size:11px;background:var(--surface)}
.lrow{display:grid;grid-template-columns:1fr 30px 30px 44px;gap:5px;align-items:center;margin-bottom:6px}
.lrow.g{grid-template-columns:1fr 96px 30px 30px 44px;box-shadow:inset 3px 0 0 var(--g);padding-left:8px}
.lrow input,.lrow select{width:100%;min-width:0;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13.5px;font-weight:300;-webkit-appearance:none;appearance:none}
.lrow button{min-height:36px;border:1px solid var(--line);border-radius:8px;color:var(--sub);font-size:11px}
.lrow button:disabled{opacity:.35}
.lrow button.armed{background:var(--rose);border-color:var(--rose);color:var(--surface)}
.lcount{font-size:9.5px;color:var(--sub);margin:-3px 0 6px 4px}
.crow{box-shadow:inset 3px 0 0 var(--navy)}
.crow::before{display:none}
.crow .cnt{margin-left:auto;font-size:10px;color:var(--sub)}
.list.one{grid-template-columns:minmax(0,1fr)!important}
.set-label small{font-size:9.5px;margin-left:4px}
.actions button{min-width:0}
.p-text{font:400 9.5pt/1.8 var(--serif);white-space:normal;margin:1.5mm 0;padding:2mm 3mm;background:var(--tint);border-radius:2mm}
.p-imgs{display:flex;flex-wrap:wrap;gap:2mm;margin-top:1.5mm}
.p-imgs img{max-height:55mm;max-width:100%;border-radius:1mm}
@media (max-width:420px){.actions{flex-wrap:wrap}.actions button{flex:1 1 30%}}
.rte{width:100%;min-height:52px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13.5px;font-weight:300;line-height:1.6;white-space:pre-wrap;word-break:keep-all;outline:none;-webkit-user-select:text;user-select:text;cursor:text}
.rte.single{min-height:0}
.rte.big{min-height:220px;font-family:var(--serif)}
.rte:focus{border-color:var(--navy)}
.fmtbar .sub{color:var(--sub)}
:root{--markbg:#e6e0ee}
.annobar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:0 0 4px}
.annobar .hint{margin:0}
.annobtn{border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.annobtn.ready{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.bodytext{-webkit-user-select:text;user-select:text}
.anno{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--olive) 30%,transparent) 60%);cursor:pointer;border-radius:1px;transition:background-color .3s}
.anno.flash{background-color:color-mix(in srgb,var(--olive) 30%,transparent)}
.anno-n::after{content:attr(data-n);font:500 8px/1 var(--sans);color:var(--olive);vertical-align:super;margin:0 1px}
.notes{margin-top:10px;border-top:1px solid var(--line);padding-top:4px}
.notes ol{list-style:none;display:grid;gap:2px}
.notes li button{display:flex;gap:10px;width:100%;text-align:left;padding:7px 0;font-size:11px}
.nnum{flex:none;width:18px;height:18px;border-radius:50%;background:color-mix(in srgb,var(--olive) 22%,transparent);color:var(--olive);font-size:9px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.ntext{display:flex;flex-direction:column;min-width:0}
.nq-s{font-family:var(--serif);font-size:11px;color:var(--sub)}

function migrate(d){

 if(!Array.isArray(d.books)||!d.books.length)d.books=DEFAULT_BOOKS.slice();
 if(!Array.isArray(d.concepts))d.concepts=clone(SAMPLE_CONCEPTS);
 var base=d.updated||Date.now();
 if(!Array.isArray(d.bundles))d.bundles=[];
 if(!d.deleted||typeof d.deleted!=="object")d.deleted={};
 if(!d.meta||typeof d.meta!=="object")d.meta={};
 if(!d.meta.variantAdded){if(!d.fields.some(function(f){return f.key==="variant"})){var pi=-1;d.fields.forEach(function(f,i){if(f.key==="point")pi=i});d.fields.splice(pi<0?d.fields.length:pi+1,0,{key:"variant",label:"변형 포인트",type:"list"})}d.meta.variantAdded=true}
 var cut=Date.now()-120*864e5;Object.keys(d.deleted).forEach(function(k){if(d.deleted[k]<cut)delete d.deleted[k]});
 ["works","concepts","bundles"].forEach(function(k){d[k]=d[k].filter(function(x){return x&&!d.deleted[x.id]})});
 d.bundles.forEach(function(b){if(!b.id)b.id=uid("b");if(!Array.isArray(b.items))b.items=[];if(!Array.isArray(b.ext))b.ext=[];if(!b.updated)b.updated=Date.now()});
 d.works.forEach(function(w,i){if(!Array.isArray(w.evid))w.evid=[];if(!Array.isArray(w.questions))w.questions=[];if(!w.id)w.id=uid("w");if(!w.created)w.created=base-(d.works.length-i)*1000;if(!w.updated)w.updated=w.created;if(!Array.isArray(w.images))w.images=[];if(!Array.isArray(w.notes))w.notes=[]});

function termsOf(c){return [c.term].concat(c.aliases||[]).map(function(t){return String(t).trim()}).filter(function(t){return t.length>=2})}
function buildLinker(){
 LINKMAP={};var terms=[];
 DATA.concepts.forEach(function(c){termsOf(c).forEach(function(t){var k=esc(t).toLowerCase();if(!LINKMAP[k]){LINKMAP[k]=c.id;terms.push(esc(t))}})});
 terms.sort(function(a,b){return b.length-a.length});
 LINKRE=terms.length?new RegExp(terms.map(function(t){return t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}).join("|"),"gi"):null;
 LINKMAP_P={};var pt=[];
 DATA.concepts.forEach(function(c){termsOf(c).forEach(function(t){var k=t.toLowerCase();if(!LINKMAP_P[k]){LINKMAP_P[k]=c.id;pt.push(t)}})});
 pt.sort(function(a,b){return b.length-a.length});
 LINKRE_P=pt.length?new RegExp(pt.map(function(t){return t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}).join("|"),"gi"):null;
}
var LINKRE_P=null,LINKMAP_P={};
function parseBody(raw){
 var t=String(raw||"").replace(/\s+$/,"").replace(/\*\*([^\n]+?)\*\*/g,"\u0011$1\u0012").replace(/==([^\n]+?)==/g,"\u0013$1\u0014").replace(/__([^\n]+?)__/g,"\u0015$1\u0016");
 var plain="",fmt=[],b=0,m=0,u=0;
 for(var i=0;i<t.length;i++){var ch=t.charAt(i);
  if(ch==="\u0011")b++;else if(ch==="\u0012")b--;else if(ch==="\u0013")m++;else if(ch==="\u0014")m--;else if(ch==="\u0015")u++;else if(ch==="\u0016")u--;
  else{plain+=ch;fmt.push((b>0?1:0)|(m>0?2:0)|(u>0?4:0))}}
 return{plain:plain,fmt:fmt};
}
function resolveNotes(w,plain){return resolveRanges(w.notes||[],plain)}
function resolveRanges(list,plain){
 var ok=[],orphan=[];
 (list||[]).forEach(function(n){
  var s=n.start,e=n.end;
  if(!(plain.slice(s,e)===n.quote&&n.quote)){
   var best=-1,from=0,k;
   while(n.quote&&(k=plain.indexOf(n.quote,from))>-1){if(best<0||Math.abs(k-n.start)<Math.abs(best-n.start))best=k;from=k+1}
   if(best<0){orphan.push({note:n});return}
   s=best;e=best+n.quote.length;
  }
  ok.push({note:n,s:s,e:e});
 });
 ok.sort(function(a,b){return a.s-b.s||a.e-b.e});
 ok.forEach(function(x,i){x.n=i+1});orphan.forEach(function(x,i){x.n=ok.length+i+1});
 return{ok:ok,orphan:orphan};
}
function bodyRender(w,interactive){
 var pb=parseBody(w.body),plain=pb.plain,fmt=pb.fmt,rn=resolveNotes(w,plain),notes=rn.ok,cm=[],re=resolveRanges(w.evid||[],plain),evs=re.ok,hl=null;
 if(HL&&HL.wid===w.id){var hs=HL.start!=null&&plain.slice(HL.start,HL.start+HL.quote.length)===HL.quote?HL.start:plain.indexOf(HL.quote);if(hs>-1&&HL.quote)hl={s:hs,e:hs+HL.quote.length}}
 if(interactive&&PREF.autolink&&LINKRE_P){LINKRE_P.lastIndex=0;var mm;while((mm=LINKRE_P.exec(plain))){cm.push({s:mm.index,e:mm.index+mm[0].length,id:LINKMAP_P[mm[0].toLowerCase()]});if(!mm[0].length)LINKRE_P.lastIndex++}}
 var bd={0:1};bd[plain.length]=1;
 for(var i=1;i<fmt.length;i++)if(fmt[i]!==fmt[i-1])bd[i]=1;
 notes.forEach(function(x){bd[x.s]=1;bd[x.e]=1});cm.forEach(function(x){bd[x.s]=1;bd[x.e]=1});evs.forEach(function(x){bd[x.s]=1;bd[x.e]=1});if(hl){bd[hl.s]=1;bd[hl.e]=1}
 var pts=Object.keys(bd).map(Number).sort(function(a,b){return a-b}),html="";
 for(var j=0;j<pts.length-1;j++){
  var a=pts[j],z=pts[j+1];if(z<=a)continue;
  var txt=esc(plain.slice(a,z)),f=fmt[a]||0,c=null,nt=null,ev=null;
  evs.forEach(function(x){if(x.s<=a&&a<x.e)ev=x});
  cm.forEach(function(x){if(x.s<=a&&a<x.e)c=x});
  notes.forEach(function(x){if(x.s<=a&&a<x.e)nt=x});
  if(c)txt='<button class="clink" data-act="concept" data-id="'+c.id+'">'+txt+'</button>';
  if(f&4)txt="<u>"+txt+"</u>";if(f&2)txt="<mark>"+txt+"</mark>";if(f&1)txt="<b>"+txt+"</b>";
  if(ev)txt='<span class="evid"'+(interactive?' data-act="evopen" data-wid="'+w.id+'"':'')+' data-eid="'+ev.note.id+'">'+txt+'</span>';
  if(hl&&hl.s<=a&&a<hl.e)txt='<span class="hl">'+txt+'</span>';
  if(nt)txt='<span class="anno"'+(interactive?' data-act="noteopen" data-wid="'+w.id+'"':'')+' data-nid="'+nt.note.id+'">'+txt+'</span>';
  html+=txt;
  notes.forEach(function(x){if(x.e===z)html+='<span class="anno-n" data-n="'+x.n+'" aria-hidden="true"></span>'});
 }
 return{html:html,notes:rn,evid:re};
}

function advActive(){var a=S.adv;return a.fav||a.body||a.img||a.tags.length||a.concepts.length}
function passAdv(w){
 var a=S.adv;
 if(a.fav&&!w.fav)return false;
 if(a.body&&!str(w.body).trim())return false;
 if(a.img&&!(w.images&&w.images.length))return false;
 if(a.tags.length){var t=allTags(w);if(!a.tags.every(function(x){return t.indexOf(x)>-1}))return false}
 if(a.concepts.length&&!a.concepts.every(function(id){var c=conceptById(id);return !c||usesConcept(w,c)}))return false;

}
function sorted(l){
 var k=S.sort;l=l.slice();
 l.sort(function(a,b){
  if(k==="title")return ct(a,b);
  if(k==="genre")return(gi(a)-gi(b))||ct(a,b);
  if(k==="updated")return(b.updated||0)-(a.updated||0);
  if(k==="created")return(a.created||0)-(b.created||0);
  return(bi(a)-bi(b))||String(a.unit||"").localeCompare(String(b.unit||""),"ko",{numeric:true})||ct(a,b);
 });return l;
}

function toMarkup(el){
 var out="";
 function wrap(t,s){var o=(s.b?"**":"")+(s.m?"==":"")+(s.u?"__":"");return o+t+o.split("").reverse().join("")}
 function walk(n,st){
  if(n.nodeType===3){var t=n.nodeValue.replace(/\u00a0/g," ");if(t)out+=(st.b||st.m||st.u)&&t.trim()?wrap(t,st):t;return}
  if(n.nodeType!==1)return;
  var tag=n.tagName,cs=n.style||{},s={b:st.b,m:st.m,u:st.u};
  if(tag==="BR"){out+="\n";return}
  if(tag==="B"||tag==="STRONG"||/^(bold|bolder|[6-9]00)$/.test(cs.fontWeight||""))s.b=true;
  if(tag==="MARK"||(cs.backgroundColor&&!/transparent|rgba\(0, 0, 0, 0\)|initial|inherit|unset/.test(cs.backgroundColor)))s.m=true;
  if(tag==="U"||/underline/.test((cs.textDecoration||"")+(cs.textDecorationLine||"")))s.u=true;
  var block=/^(DIV|P|LI)$/.test(tag);
  if(block&&out&&out.slice(-1)!=="\n")out+="\n";
  for(var c=n.firstChild;c;c=c.nextSibling)walk(c,s);
  if(block&&out&&out.slice(-1)!=="\n")out+="\n";
 }
 for(var c=el.firstChild;c;c=c.nextSibling)walk(c,{});
 for(var i=0;i<3;i++)out=out.replace(/\*\*\*\*/g,"").replace(/====/g,"").replace(/____/g,"");
 out=out.replace(/\n$/,"");
 return el.dataset.single?out.replace(/\n/g," ").trim():out;
}

/* ---------- bulk parsing ---------- */
function labelMap(){
 var m={};CORE.forEach(function(c){m[norm(c[1])]={core:c[0]}});m[norm("단원·회차")]={core:"unit"};m[norm("원문")]={core:"body"};
 DATA.fields.forEach(function(f){m[norm(f.label)]={field:f}});return m;
}
function setVal(w,hit,val,first){
 if(hit.core==="body"){w.body=w.body==null||first&&!w.body?val:w.body+"\n"+val;return}
 if(hit.core){if(val)w[hit.core]=first||!w[hit.core]?val:w[hit.core]+" "+val;return}
 var f=hit.field,k=f.key;
 if(f.type==="list"){w[k]=w[k]||[];val=val.replace(/^[-•·*]\s*/,"");if(val)w[k].push(val)}
 else if(f.type==="tags"||f.type==="works"){w[k]=(w[k]||[]).concat(tagsOf(val))}
 else if(f.type==="long"){if(val)w[k]=w[k]?w[k]+"\n"+val:val}
 else{if(val)w[k]=w[k]?w[k]+" "+val:val}
}
function parseBulk(text){
 text=(text||"").replace(/\r/g,"").trim();
 if(!text)return{works:[],errors:["내용이 비어 있어요."]};
 if(/^[\[{]/.test(text)){
  try{var j=JSON.parse(text),l=Array.isArray(j)?j:(j.data&&j.data.works)||j.works||[j];
   return{works:l.filter(function(x){return x&&x.title}).map(function(x){return clone(x)}),errors:[]}}
  catch(e){return{works:[],errors:["JSON 형식이 올바르지 않아요."]}}
 }
 var m=labelMap(),works=[],errors=[];
 text.split(/\n\s*-{3,}\s*(?:\n|$)/).forEach(function(b,bi){
  var w={},cur=null;
  b.split("\n").forEach(function(line){
   var mm=cur&&cur.core==="body"?null:line.match(/^\s*([^:：\-•*][^:：]{0,18})\s*[:：]\s*(.*)$/),hit=mm&&m[norm(mm[1])];
   if(hit){cur=hit;setVal(w,hit,mm[2].trim(),true)}
   else if(cur&&cur.core==="body")setVal(w,cur,line.replace(/\s+$/,""),false);
   else if(cur&&line.trim())setVal(w,cur,line.trim(),false);
  });
  if(w.body!=null){w.body=w.body.replace(/^\n+|\s+$/g,"");if(!w.body)delete w.body}
  if(!w.title){if(b.trim())errors.push((bi+1)+"번째 작품에 작품명이 없어서 제외했어요.");return}
  works.push(w);
 });
 return{works:works,errors:errors};
}
function findSame(x){
 if(x.id&&byId(x.id))return byId(x.id);
 return DATA.works.filter(function(w){return norm(w.title)===norm(x.title)&&norm(w.author)===norm(x.author)})[0]||null;
}
function commitBulk(){
 var p=modal.parsed,over=modal.overwrite,now=Date.now(),touched=[],added=0,changed=0;
 p.works.forEach(function(x,i){
  var ex=findSame(x);if(ex&&!over)return;
  var tgt=ex||{id:x.id&&!byId(x.id)?x.id:uid("w"),created:now+i,images:[]};
  Object.keys(x).forEach(function(k){if(k!=="id"&&k!=="created"&&k!=="updated")tgt[k]=x[k]});
  if(!Array.isArray(tgt.images))tgt.images=[];
  tgt.updated=now;if(!ex){DATA.works.push(tgt);added++}else changed++;touched.push(tgt);
 });
 DATA.fields.filter(function(f){return f.type==="works"}).forEach(function(f){
  touched.forEach(function(w){w[f.key]=tagsOf(w[f.key]).map(function(v){if(byId(v))return v;var hit=DATA.works.filter(function(z){return norm(z.title)===norm(v)})[0];return hit&&hit.id!==w.id?hit.id:null}).filter(Boolean)});
 });
 save(added+"편 추가, "+changed+"편 덮어씀");
}

function stamp(){var d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")}

function stampAll(d,t){d.deleted=d.deleted||{};["works","concepts","bundles"].forEach(function(k){(d[k]||[]).forEach(function(x){x.updated=t;delete d.deleted[x.id]})});d.meta=d.meta||{};d.meta.fieldsAt=t;d.meta.listsAt=t;d.updated=t}

root.addEventListener("input",function(ev){
 var t=ev.target;
 if(t.id==="q"){S.q=t.value;document.getElementById("list").innerHTML=listItems();keepUI()}
 else if(t.id==="cq"){S.cq=t.value;var q=t.value.trim().toLowerCase();keepUI();
  var list=DATA.concepts.filter(function(c){return(S.ccat==="all"||c.category===S.ccat)&&(!q||[c.term,(c.aliases||[]).join(" "),c.desc,c.example].join(" ").toLowerCase().indexOf(q)>-1)}).sort(function(a,b){return a.term.localeCompare(b.term,"ko")});
  document.getElementById("clist").innerHTML=conceptRows(list)}
 else if(t.classList.contains("flabel")&&modal&&modal.draft)modal.draft[+t.dataset.i].label=t.value;
 else if(t.classList.contains("lname")&&modal&&modal[t.dataset.k])modal[t.dataset.k][+t.dataset.i].name=t.value;
 else if(t.classList.contains("imgcap")&&modal&&modal.images){var im=modal.images[+t.dataset.i];if(im)im.caption=t.value;queueDraft()}
 else if(t.id==="b-text"&&modal)modal.text=t.value;
 else if(t.closest("#form"))queueDraft();
});
root.addEventListener("change",function(ev){
 var t=ev.target;
 if(t.classList.contains("ftype")&&modal&&modal.draft)modal.draft[+t.dataset.i].type=t.value;
 else if(t.classList.contains("lcolor")&&modal&&modal.genres){modal.genres[+t.dataset.i].color=t.value;render()}
 else if(t.id==="b-over"){modal.overwrite=t.checked;render()}
 else if(t.id==="img-file"&&t.files&&t.files.length){addImages(t.files)}
 else if(t.id==="restore-file"&&t.files&&t.files[0]){var r=new FileReader();r.onload=function(){readBackup(String(r.result))};r.onerror=function(){modal.err="파일을 읽지 못했어요.";render()};r.readAsText(t.files[0])}
 else if(t.closest("#form"))queueDraft();
});

var tx=null,ty=null;
root.addEventListener("touchstart",function(ev){if(!modal&&ev.target.closest("#card")&&!ev.target.closest(".toc,.bodytext,.annobar")){tx=ev.touches[0].clientX;ty=ev.touches[0].clientY}else tx=null},{passive:true});
root.addEventListener("touchend",function(ev){if(tx===null)return;var dx=ev.changedTouches[0].clientX-tx,dy=ev.changedTouches[0].clientY-ty;tx=null;
 if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2){ev.preventDefault();move(dx<0?1:-1)}});
var wasWide=isWide();
window.addEventListener("resize",function(){var w=isWide();if(w!==wasWide){wasWide=w;if(!modal)render()}});

document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")scheduleSync(300)});
window.addEventListener("online",function(){scheduleSync(300)});
setInterval(function(){if(document.visibilityState==="visible"&&GIST.token&&!syncing)syncNow()},120000);
setInterval(function(){var el=document.getElementById("syncstat");if(el&&SYNC.s==="idle")el.outerHTML=syncStat()},60000);
root.innerHTML='<div class="wrap"><p class="hint">노트를 여는 중…</p></div>';
if("serviceWorker" in navigator&&location.protocol!=="file:"){
 navigator.serviceWorker.register("sw.js").then(function(reg){
  reg.addEventListener("updatefound",function(){var nw=reg.installing;if(!nw)return;nw.addEventListener("statechange",function(){if(nw.state==="installed"&&navigator.serviceWorker.controller)toast("새 버전을 받았어요. 앱을 다시 열면 적용돼요")})});
 }).catch(function(){});
}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(function(p){if(!p)navigator.storage.persist()}).catch(function(){});
idbOpen().then(function(db){IDB=db;return Promise.all([kvGet("data"),kvGet("imgs")])}).then(function(r){
 var d=migrate(r[0]);
 if(!d){var legacy=migrate(jget(localStorage,LS));if(legacy){d=legacy;d.meta.touched=true}}
 if(d)DATA=d;
 IMGS=r[1]&&typeof r[1]==="object"?r[1]:{};
 if(extractInline())setImgDirty(true);
 kvSet("data",DATA);kvSet("imgs",IMGS);
 render();scheduleSync(200);
});
})();
</script>
</body>
</html>
